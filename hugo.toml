baseURL = "https://example.org/"
locale = "en-us"
title = "Splunk Workshops"
defaultContentLanguage = "en"
enableEmoji = true
enableRobotsTXT = true
enableGitInfo = false

# Markup configuration — Goldmark with attributes & raw HTML enabled for rich content
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel  = 4
    ordered   = false
  [markup.highlight]
    noClasses = false
    lineNos = false
    codeFences = true
    guessSyntax = true
    tabWidth = 2

# Output formats
[outputs]
  home    = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  page    = ["HTML"]

# ==========================================================================
# Theme parameters — every visual choice is overridable per-site.
# Drop these in your own site's hugo.toml to rebrand the theme entirely.
# ==========================================================================
[params]
  # ---- Identity ----------------------------------------------------------
  brandName       = "splunk>"
  brandTagline    = ""           # set to "" to suppress the "splunk> | workshops" tag pill
  description     = "Hands-on technical workshops."
  copyright       = "&copy; {year} Splunk LLC All rights reserved."   # `{year}` expands to the current year; HTML allowed
  logoLight       = "images/splunk-logo-black.png"
  logoDark        = "images/splunk-logo-white.png"
  logoHeight      = "28"
  favicon         = "favicon.svg"

  # ---- Hero background (the "light trails" gradient bloom) ----------------
  # Set both to "" to fall back to the bundled CSS radial gradient.
  heroBackgroundLight = "images/background_Splunk-light-mode2_16x9.png"
  heroBackgroundDark  = "images/background_Splunk-dark-mode2_16x9.png"

  # ---- Mode --------------------------------------------------------------
  defaultMode     = "auto"
  showThemeToggle = true

  # ---- Colors (light mode) — Official Splunk brand gradient ---------------
  # Magenta 50 → Orange 50, 10%/90% stops. Source: Splunk brand guidelines.
  colorAccent      = "#FF007F"   # Magenta 50  · rgb(255, 0, 127)   · Pantone 213 C
  colorAccent2     = "#FF9000"   # Orange 50   · rgb(255, 144, 0)   · Pantone 151 C
  colorAccent3     = "#FFAB0F"   # supplementary amber (used for warm callouts only)
  colorAccentDark  = "#D4006B"   # reserved for borders/shadows; brand pink text is always #FF007F

  colorInk          = "#0C1724"
  colorInkMuted     = "#4B4D52"
  colorPaper        = "#FFFFFF"
  colorSurface      = "#F7F6F3"
  colorSurfaceAlt   = "#EFEDE7"
  colorBorder       = "#E5E2DA"
  colorBorderStrong = "#D6D2C8"

  # ---- Colors (dark mode) ------------------------------------------------
  colorInkDark          = "#F4F1EA"
  colorInkMutedDark     = "#9CA3AF"
  colorPaperDark        = "#0C1724"
  colorSurfaceDark      = "#141E2F"
  colorSurfaceAltDark   = "#1B2740"
  colorBorderDark       = "#1F2C44"
  colorBorderStrongDark = "#2A3A56"

  # ---- Typography — same stack as splunk.github.io/observability-workshop --
  fontUrl     = "https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
  fontDisplay = "'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
  fontBody    = "'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
  fontMono    = "'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace"

  # ---- Layout ------------------------------------------------------------
  showSidebar     = true
  showToc         = true
  showProgress    = true
  showLightTrails = true
  contentMaxWidth = "720px"

  # ---- Repo / edit-on-github --------------------------------------------
  editURL = ""
  repoURL = ""

  [params.social]
    github   = ""
    twitter  = ""
    linkedin = ""
    youtube  = ""
