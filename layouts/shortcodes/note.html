{{- $title := .Get "title" | default (.Get 0) -}}
<div class="callout callout--note">
  <span class="callout__icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6 M9 13h6 M9 17h6"/></svg>
  </span>
  <div class="callout__body">
    <p class="callout__title">{{ $title | default "Note" }}</p>
    {{ .Inner | .Page.RenderString }}
  </div>
</div>
