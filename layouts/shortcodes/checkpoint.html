{{- /*
  Checkpoint — a "you've made it this far" milestone marker.
  {{< checkpoint "Logged in successfully" >}}
*/ -}}
{{- $title := .Get "title" | default (.Get 0) | default (i18n "checkpoint") -}}
<aside class="checkpoint">
  <p class="checkpoint__label">{{ i18n "checkpoint" }}</p>
  <p class="checkpoint__title">{{ $title }}</p>
</aside>
