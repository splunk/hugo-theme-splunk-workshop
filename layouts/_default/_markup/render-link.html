{{- $external := strings.HasPrefix .Destination "http" -}}
{{- $href     := partial "site-href.html" .Destination -}}
<a href="{{ $href | safeURL }}"{{ with .Title }} title="{{ . }}"{{ end }}{{ if $external }} target="_blank" rel="noopener"{{ end }}>{{ .Text | safeHTML }}{{ if $external }} <span aria-hidden="true" style="font-size:0.75em;opacity:0.6;">&#x2197;</span>{{ end }}</a>
